
[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1

[coverage:run]
branch = True
source = service
omit =
    */tests/*
    */venv/*

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 70

[flake8]
max-line-length = 100
exclude = .git,__pycache__,venv
ignore = E203,W503

[MASTER]
ignore = tests

[MESSAGES CONTROL]
disable = C0114,C0115,C0116

[FORMAT]
max-line-length = 100
